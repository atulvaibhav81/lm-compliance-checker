# alembic.ini — Alembic configuration for LM Compliance Checker

[alembic]
# Path to migration scripts
script_location = alembic

# SQLAlchemy connection URL — overridden at runtime from .env via env.py
sqlalchemy.url = sqlite:///./lm_compliance.db

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
